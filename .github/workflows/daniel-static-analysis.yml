name: Daniel runtime static analysis

on:
  push:
    branches:
      - research/daniel-runtime-analysis-20260904
    paths:
      - .github/workflows/daniel-static-analysis.yml
      - research/daniel/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cabextract file innoextract llvm p7zip-full
          python -m pip install --disable-pip-version-check \
            capstone==5.0.6 pefile==2024.8.26 pyelftools==0.32

      - name: Analyze public installer without executing it
        run: |
          rm -rf analysis-output
          mkdir -p analysis-output
          URL="https://github.com/danielblnc/DLSS-NR-on-AMD/releases/download/v0.2.9/dlssnr_on_amd_setup.exe"
          SHA="b4b31e19e1d9028b3d63b7ac5074d7f71ede736d6185c11d25863f6415c6ece9"
          python research/daniel/analyze_installer.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/carve_payloads.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/xref_pe.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output

      - name: Enforce static-only artifact policy and print evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("analysis-output")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          payloads = json.loads((root / "payload-map.json").read_text(encoding="utf-8"))
          xrefs = json.loads((root / "pe-xrefs.json").read_text(encoding="utf-8"))
          for item in (report, payloads, xrefs):
              assert item["analysis_mode"] == "static_only_never_executed"
          assert report["expected_sha256_matched"] is True
          assert payloads["installer_sha256"] == report["installer"]["sha256"] == xrefs["installer_sha256"]
          forbidden = {".exe", ".dll", ".bin", ".so", ".cubin", ".hsaco", ".elf"}
          leaked = [str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() in forbidden]
          assert not leaked, leaked

          print((root / "report.md").read_text(encoding="utf-8"))
          print((root / "payload-map.md").read_text(encoding="utf-8"))
          print((root / "pe-xrefs.md").read_text(encoding="utf-8"))

          print("\n=== PAYLOAD MACHINE SUMMARY ===")
          print(json.dumps({
              "valid_pe_offsets": payloads["valid_pe_offsets"],
              "valid_elf_offsets": payloads["valid_elf_offsets"],
              "pe": [{
                  "offset": x["offset"],
                  "kind": x["kind"],
                  "intrinsic_size": x["intrinsic_size"],
                  "sha256": x["intrinsic_sha256"],
                  "imports": x["imports"],
                  "exports": x["exports"],
                  "resources": x["resources"],
              } for x in payloads["pe_candidates"]],
              "elf": [{
                  "offset": x["offset"],
                  "machine": x["machine"],
                  "intrinsic_size": x["intrinsic_size"],
                  "sha256": x["intrinsic_sha256"],
                  "kernel_symbols": x["kernel_symbols"],
                  "notes": x["notes"],
              } for x in payloads["elf_candidates"]],
          }, indent=2, ensure_ascii=False))
          PY

      - name: Upload metadata-only report
        uses: actions/upload-artifact@v4
        with:
          name: daniel-v0.2.9-static-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
