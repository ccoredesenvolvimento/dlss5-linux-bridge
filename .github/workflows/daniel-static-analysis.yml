name: Daniel runtime static analysis

on:
  push:
    branches:
      - research/daniel-runtime-analysis-20260904
    paths:
      - .github/workflows/daniel-static-analysis.yml
      - research/daniel/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cabextract file innoextract llvm p7zip-full
          python -m pip install --disable-pip-version-check \
            capstone==5.0.6 msgpack==1.1.1 pefile==2024.8.26 pyelftools==0.32

      - name: Analyze public installer without executing it
        run: |
          rm -rf analysis-output
          mkdir -p analysis-output
          URL="https://github.com/danielblnc/DLSS-NR-on-AMD/releases/download/v0.2.9/dlssnr_on_amd_setup.exe"
          SHA="b4b31e19e1d9028b3d63b7ac5074d7f71ede736d6185c11d25863f6415c6ece9"
          python research/daniel/analyze_installer.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/carve_payloads.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/xref_pe.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/decode_amdgpu_metadata.py \
            --url "$URL" --expected-sha256 "$SHA" --output analysis-output
          python research/daniel/summarize_contract.py \
            --input analysis-output --output analysis-output --radius 14

      - name: Enforce static-only policy and print compact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("analysis-output")
          names = ["report.json", "payload-map.json", "pe-xrefs.json", "amdgpu-abi.json", "contract-summary.json"]
          reports = [json.loads((root / name).read_text(encoding="utf-8")) for name in names]
          for item in reports:
              assert item["analysis_mode"] == "static_only_never_executed"
          digests = {
              reports[0]["installer"]["sha256"],
              reports[1]["installer_sha256"],
              reports[2]["installer_sha256"],
              reports[3]["installer_sha256"],
              reports[4]["installer_sha256"],
          }
          assert len(digests) == 1, digests
          forbidden = {".exe", ".dll", ".bin", ".so", ".cubin", ".hsaco", ".elf"}
          leaked = [str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() in forbidden]
          assert not leaked, leaked

          compact = reports[4]
          print("=== CONTRACT COUNTS ===")
          print(json.dumps({
              "installer_sha256": compact["installer_sha256"],
              "pe_images": compact["pe_image_count"],
              "contract_functions": len(compact["contract_functions"]),
              "amdgpu_code_objects": len(compact["amdgpu_code_objects"]),
              "kernels": sum(len(x["kernels"]) for x in compact["amdgpu_code_objects"]),
          }, indent=2))

          print("\n=== WEIGHT-CONTAINER AND RECOGNITION XREFS ===")
          for fn in compact["contract_functions"]:
              if fn["category"] not in {"weight_container", "weight_recognition"}:
                  continue
              print(json.dumps({
                  "pe_index": fn["pe_index"],
                  "pe_offset": fn["pe_offset"],
                  "category": fn["category"],
                  "begin_rva": fn["function_begin_rva"],
                  "end_rva": fn["function_end_rva"],
                  "size": fn["function_size"],
                  "targets": fn["targets"],
              }, indent=2, ensure_ascii=False))
              for window in fn["windows"]:
                  print("--- XREF WINDOW ---")
                  print("\n".join(window["lines"]))

          print("\n=== AMDGPU ABI SUMMARY ===")
          for obj in compact["amdgpu_code_objects"]:
              print(json.dumps({
                  "index": obj["index"],
                  "offset": obj["offset"],
                  "size": obj["size"],
                  "targets": obj["targets"],
                  "metadata_versions": obj["metadata_versions"],
                  "kernels": [{
                      "name": k["name"],
                      "symbol": k["symbol"],
                      "kernarg_segment_size": k["kernarg_segment_size"],
                      "group_segment_fixed_size": k["group_segment_fixed_size"],
                      "sgpr_count": k["sgpr_count"],
                      "vgpr_count": k["vgpr_count"],
                      "max_flat_workgroup_size": k["max_flat_workgroup_size"],
                      "wavefront_size": k["wavefront_size"],
                      "args": k["args"],
                  } for k in obj["kernels"]],
              }, indent=2, ensure_ascii=False))
          PY

      - name: Upload metadata-only report
        uses: actions/upload-artifact@v4
        with:
          name: daniel-v0.2.9-static-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
