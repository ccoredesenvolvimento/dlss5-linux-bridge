name: Daniel weight-container xref

on:
  push:
    branches:
      - research/daniel-runtime-analysis-20260904
    paths:
      - .github/workflows/daniel-weight-xref.yml
      - research/daniel/xref_pe.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/daniel-runtime-analysis-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check capstone==5.0.6 pefile==2024.8.26
      - name: Recover static xrefs
        run: |
          rm -rf xref-output
          URL="https://github.com/danielblnc/DLSS-NR-on-AMD/releases/download/v0.2.9/dlssnr_on_amd_setup.exe"
          SHA="b4b31e19e1d9028b3d63b7ac5074d7f71ede736d6185c11d25863f6415c6ece9"
          python research/daniel/xref_pe.py --url "$URL" --expected-sha256 "$SHA" --output xref-output
          test -f xref-output/pe-xrefs.md
          test -f xref-output/pe-xrefs.json
          ! find xref-output -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.bin' -o -name '*.elf' -o -name '*.hsaco' \) | grep .
      - name: Publish metadata-only xrefs
        run: |
          mkdir -p research/daniel/results
          cp xref-output/pe-xrefs.md research/daniel/results/pe-xrefs.md
          cp xref-output/pe-xrefs.json research/daniel/results/pe-xrefs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/daniel/results/pe-xrefs.md research/daniel/results/pe-xrefs.json
          if ! git diff --cached --quiet; then
            git commit -m "research: publish sanitized weight xrefs [skip ci]"
            git push origin HEAD:research/daniel-runtime-analysis-20260904
          fi
