name: DLSSNRW1 contract tests

on:
  push:
    branches:
      - research/daniel-runtime-analysis-20260904
    paths:
      - research/daniel/dlssnrw1.py
      - research/daniel/test_dlssnrw1.py
      - .github/workflows/dlssnrw1-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Run container format tests
        working-directory: research/daniel
        run: |
          python -m py_compile dlssnrw1.py
          pytest -q test_dlssnrw1.py
